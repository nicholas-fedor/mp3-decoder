---
name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read # Set default read-only permissions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read # For reading the tag
    steps:
      - name: Require a Production Tag Format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH production tag."
            exit 1
          fi
          echo "Releasing $TAG"

  test:
    name: Run Tests
    needs: [validate-tag]
    uses: ./.github/workflows/test.yaml # zizmor: ignore[self-repository] actionlint rejects $/ until rhysd/actionlint#711
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read # For code checkout

  update-go-docs:
    name: Run Go Pkg Update
    needs: [test]
    permissions:
      contents: read # For the called workflow's default
    uses: ./.github/workflows/update-go-docs.yaml # zizmor: ignore[self-repository] actionlint rejects $/ until rhysd/actionlint#711
