---
name: Run Security Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "**/testdata/**"
      - go.mod
      - go.sum
      - build/golangci-lint/**
  schedule:
    - cron: "0 0 * * *"

env:
  OUTPUT_FILE: results.sarif

permissions:
  contents: read # Set default read-only permissions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gosec:
    name: Run gosec Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read # For checking out the code
      security-events: write # For uploading the gosec results to code scanning
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          cache: true
          cache-dependency-path: "**/go.sum"
          go-version-file: go.mod

      # gosec runs through golangci-lint so that the lint config's exclusions and nolint directives apply.
      # The lint workflow fails on gosec findings, so this scan only reports them.
      # The empty path mode replaces the config's absolute paths with paths from the repository root,
      # which code scanning matches against the repository's files.
      - name: Run gosec Through golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: >-
            --config=build/golangci-lint/golangci-lint.yaml
            --enable-only=gosec
            --issues-exit-code=0
            --path-mode=
            --output.sarif.path=${{ env.OUTPUT_FILE }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ env.OUTPUT_FILE }}
          category: gosec-sarif

  govulncheck:
    name: Run govulncheck Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read # For govulncheck to check out the code
      security-events: write # For uploading the govulncheck results to code scanning
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Run govulncheck
        id: govulncheck
        uses: nicholas-fedor/govulncheck-action@694df29e64ce246bd2a8cf18e6a9b5f45bd49d30 # v1.1.2
        with:
          output-format: sarif
          output-file: ${{ env.OUTPUT_FILE }}
          go-version-file: "go.mod"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ env.OUTPUT_FILE }}
          category: govulncheck-sarif
